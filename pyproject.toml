[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "countdown"
version = "1.0.0"
description = "Countdown numbers-round game with an exhaustive search solver"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yuvan Marimuthu" }]

[project.scripts]
countdown = "countdown.game:play"

[tool.setuptools.packages.find]
where = ["src"]
